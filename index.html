                return c.microMarket.toLowerCase().includes(filterZone.toLowerCase());

                setSwipeDirection(direction);

                    setTimeout(() => {
                        setMatchedCard(currentCard);
                    }, 100);
                }

                    setCurrentIndex(prev => prev + 1);
                    setSwipeDirection(null);
                    setDragOffset({ x: 0, y: 0 });

                setCurrentIndex(0);
                setMatchedCard(null);
            };

                setIsDragging(true);
                dragStart.current = {
                    x: e.touches ? e.touches[0].clientX : e.clientX,
                    y: e.touches ? e.touches[0].clientY : e.clientY
                };
            };

            const onTouchMove = (e) => {
                if (!isDragging) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const currentY = e.touches ? e.touches[0].clientY : e.clientY;
                setDragOffset({
                    x: currentX - dragStart.current.x,
                    y: currentY - dragStart.current.y
                });
            };

            const onTouchEnd = () => {
                if (!isDragging) return;
                setIsDragging(false);
                if (dragOffset.x > 80) {
                    handleSwipe('RIGHT');
                } else if (dragOffset.x < -80) {
                    handleSwipe('LEFT');
                } else {
                    setDragOffset({ x: 0, y: 0 });
                }

                                    {currentCard ? (
                                        <div 
                                            className="swipe-card w-full max-w-md rounded-2xl bg-zinc-900 border border-zinc-800 overflow-hidden shadow-2xl relative cursor-grab active:cursor-grabbing"
                                            style={{
                                                transform: `translateX(${dragOffset.x}px) translateY(${dragOffset.y}px) rotate(${dragOffset.x * 0.04}deg)`,
                                                opacity: swipeDirection ? 0.6 : 1
                                            }}
                                            onTouchStart={onTouchStart}
                                            onTouchMove={onTouchMove}
                                            onTouchEnd={onTouchEnd}
                                            onMouseDown={onTouchStart}
                                            onMouseMove={onTouchMove}
                                            onMouseUp={onTouchEnd}
                                            onMouseLeave={onTouchEnd}
                                        >
                                            <div className="h-48 relative overflow-hidden bg-zinc-950">
                                                <img 
                                                    src={currentCard.image} 
                                                    alt={currentCard.title} 
                                                    className="w-full h-full object-cover opacity-80" 
                                                />
                                                <div className="absolute inset-0 bg-gradient-to-t from-zinc-900 via-zinc-900/40 to-transparent"></div>
                                                
                                                <div className="absolute top-4 left-4">
                                                    <span className={`px-2.5 py-1 rounded text-[10px] font-mono-tech font-bold uppercase tracking-wider ${
                                                        currentCard.dealType.includes('HAVE') ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                                    }`}>
                                                        {currentCard.dealType}
                                                    </span>
                                                </div>

                                                <div className="absolute top-4 right-4 px-2 py-0.5 rounded bg-zinc-950/80 backdrop-blur-md text-[10px] text-zinc-400 font-mono-tech border border-zinc-800">
                                                    RERA VERIFIED
                                                </div>

                                                <div className="absolute bottom-3 left-4 right-4">
                                                    <div className="text-[11px] font-mono-tech text-amber-500 font-medium">
                                                        <i className="fa-solid fa-location-dot mr-1.5"></i>
                                                        {currentCard.microMarket}
                                                    </div>
                                                    <h3 className="font-heading text-xl font-bold text-white mt-0.5">
                                                        {currentCard.title}
                                                    </h3>
                                                </div>
                                            </div>

                                            <div className="p-5 space-y-4 bg-zinc-900">
                                                <div className="grid grid-cols-2 gap-3 text-xs font-mono-tech">
                                                    <div className="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
                                                        <div className="text-[10px] text-zinc-500 uppercase">Scale / Area</div>
                                                        <div className="font-bold text-white mt-0.5">{currentCard.size}</div>
                                                    </div>
                                                    <div className="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
                                                        <div className="text-[10px] text-zinc-500 uppercase">Price / Rent</div>
                                                        <div className="font-bold text-amber-400 mt-0.5">{currentCard.price}</div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2 text-xs text-zinc-400 pt-1">
                                                    <div className="flex justify-between border-b border-zinc-850 pb-2">
                                                        <span>Terms:</span>
                                                        <span className="text-white font-medium">{currentCard.yield}</span>
                                                    </div>
                                                    <div className="flex justify-between border-b border-zinc-850 pb-2">
                                                        <span>Brokerage Split:</span>
                                                        <span className="text-emerald-400 font-semibold">{currentCard.commission}</span>
                                                    </div>
                                                    <div className="flex justify-between pb-1">
                                                        <span>Mandate Agent:</span>
                                                        <span className="text-zinc-200">{currentCard.agentName}</span>
                                                    </div>
                                                </div>

                                                <div className="flex flex-wrap gap-1.5 pt-1">
                                                    {currentCard.tags.map((tag, i) => (
                                                        <span key={i} className="px-2 py-0.5 rounded bg-zinc-950 text-[10px] text-zinc-400 border border-zinc-800 font-mono-tech">
                                                            #{tag}
                                                        </span>
                                                    ))}
                                                </div>

                                                <div className="pt-2 flex items-center justify-between gap-3 font-heading">
                                                    <button 
                                                        onClick={() => handleSwipe('LEFT')}
                                                        className="flex-1 py-3 rounded-xl bg-zinc-950 hover:bg-zinc-850 text-zinc-400 hover:text-white border border-zinc-800 font-semibold text-xs transition-all flex items-center justify-center space-x-2"
                                                    >
                                                        <i className="fa-solid fa-xmark"></i>
                                                        <span>PASS</span>
                                                    </button>

                                                    <button 
                                                        onClick={() => handleSwipe('RIGHT')}
                                                        className="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-xs transition-all shadow-md flex items-center justify-center space-x-2"
                                                    >
                                                        <i className="fa-solid fa-handshake"></i>
                                                        <span>CO-BROKER</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-full max-w-md rounded-2xl bg-zinc-900 border border-zinc-800 p-8 text-center space-y-6">
                                            <div className="w-12 h-12 rounded-full bg-zinc-950 border border-zinc-800 text-amber-500 flex items-center justify-center mx-auto text-xl">
                                                <i className="fa-solid fa-check"></i>
                                            </div>
                                            <div>
                                                <h3 className="font-heading text-xl font-bold text-white">Zone Queue Cleared</h3>
                                                <p className="text-xs text-zinc-400 mt-2 font-mono-tech">
                                                    All active commercial cards for "{filterZone}" have been evaluated.
                                                </p>
                                            </div>
                                            <button 
                                                onClick={resetDeck}
                                                className="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 font-heading font-bold text-xs transition-all"
                                            >
                                                Reset Match Deck
                                            </button>
                                        </div>
                                    )}

                                    {/* Match Modal */}
                                    {matchedCard && (
                                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md">
                                            <div className="w-full max-w-md rounded-2xl bg-zinc-900 border border-amber-500/40 p-6 text-center space-y-6 shadow-2xl">
                                                <div className="w-14 h-14 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-500 flex items-center justify-center mx-auto text-2xl">
                                                    <i className="fa-solid fa-handshake-angle"></i>
                                                </div>

                                                <div>
                                                    <span className="text-[10px] font-mono-tech text-amber-500 uppercase tracking-widest">CO-BROKING MATCH CONFIRMED</span>
                                                    <h3 className="font-heading text-2xl font-black text-white mt-1">Direct Match Created</h3>
                                                    <p className="text-xs text-zinc-400 mt-2">
                                                        Agent <strong className="text-white">{matchedCard.agentName}</strong> ({matchedCard.agency}) holding mandate for <strong className="text-white">{matchedCard.title}</strong> is unlocked.
                                                    </p>
                                                </div>

                                                <div className="p-4 rounded-xl bg-zinc-950 border border-zinc-800 text-left space-y-2 text-xs font-mono-tech">
                                                    <div className="flex justify-between">
                                                        <span className="text-zinc-500">RERA License:</span>
                                                        <span className="text-amber-400">{matchedCard.verifiedRera}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-zinc-500">Commission terms:</span>
                                                        <span className="text-emerald-400">{matchedCard.commission}</span>
                                                    </div>
                                                </div>

                                                <div className="space-y-3 font-heading">
                                                    <button 
                                                        onClick={() => {
                                                            triggerToast("Connecting to verified agent WhatsApp...");
                                                            setMatchedCard(null);
                                                        }}
                                                        className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-xs transition-all shadow-md flex items-center justify-center space-x-2"
                                                    >
                                                        <i className="fa-brands fa-whatsapp text-sm"></i>
                                                        <span>Open WhatsApp Connection</span>
                                                    </button>
                                                    
                                                    <button 
                                                        onClick={() => setMatchedCard(null)}
                                                        className="w-full py-2 text-xs text-zinc-500 hover:text-zinc-300"
                                                    >
                                                        Return to Deck
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </section>
                        )}

                        {/* ==================== PAGE: ABOUT US ==================== */}
                        {currentPage === 'about' && (
                            <section className="py-16 px-6 max-w-4xl mx-auto space-y-12">
                                <div className="space-y-4 text-center">
                                    <span className="text-amber-500 text-xs font-mono-tech font-bold uppercase tracking-widest">THE DRAVONIS DOCTRINE</span>
                                    <h1 className="font-heading text-4xl sm:text-5xl font-extrabold text-white">Building India's Crexi from Jaipur.</h1>
                                    <p className="text-zinc-400 text-base leading-relaxed">
                                        Commercial real estate in India is not a residential classified business. It is driven by trust, relationships, and off-market broker liquidity.
                                    </p>
                                </div>

                                <div className="p-8 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-6 text-sm text-zinc-300 leading-relaxed">
                                    <h3 className="font-heading text-xl font-bold text-white">The Operational Moat</h3>
                                    <p>
                                        Traditional proptech portals focus heavily on residential consumer listings, leaving commercial real estate (offices, retail showrooms, warehouses, industrial plots) fragmented inside unorganized chat groups.
                                    </p>
                                    <p>
                                        Dravonis solves this by aggregating a structured database of over 10,000 verified RERA commercial brokers starting in Jaipur, providing a dedicated B2B transaction floor designed for rapid co-broking.
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-zinc-800 font-mono-tech text-xs">
                                        <div className="p-4 rounded-xl bg-zinc-950 border border-zinc-800">
                                            <div className="text-amber-500 font-bold">Phase 1: Local Liquidity</div>
                                            <div className="text-zinc-400 mt-1">High-speed RERA broker onboarding in Jaipur key hubs (C-Scheme, Tonk Road, Ajmer Road).</div>
                                        </div>
                                        <div className="p-4 rounded-xl bg-zinc-950 border border-zinc-800">
                                            <div className="text-amber-500 font-bold">Phase 2: SaaS Matchmaker</div>
                                            <div className="text-zinc-400 mt-1">Single-swipe matching engine automating co-broking agreements across Tier-1/2 growth hubs.</div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* ==================== PAGE: FAQS ==================== */}
                        {currentPage === 'faq' && (
                            <section className="py-16 px-6 max-w-4xl mx-auto space-y-10">
                                <div className="text-center space-y-3">
                                    <span className="text-amber-500 text-xs font-mono-tech font-bold uppercase tracking-widest">FREQUENTLY ASKED QUESTIONS</span>
                                    <h1 className="font-heading text-4xl font-extrabold text-white">Everything You Need to Know</h1>
                                </div>

                                <div className="space-y-4">
                                    {FAQ_ITEMS.map((item, idx) => (
                                        <div 
                                            key={idx}
                                            onClick={() => setOpenFaq(openFaq === idx ? -1 : idx)}
                                            className="p-6 rounded-2xl bg-zinc-900 border border-zinc-800 cursor-pointer transition-all hover:border-zinc-700"
                                        >
                                            <div className="flex justify-between items-center">
                                                <h3 className="font-heading font-bold text-white text-base">{item.q}</h3>
                                                <i className={`fa-solid fa-chevron-down text-amber-500 text-xs transition-transform ${openFaq === idx ? 'rotate-180' : ''}`}></i>
                                            </div>
                                            {openFaq === idx && (
                                                <p className="text-xs text-zinc-400 leading-relaxed mt-4 pt-4 border-t border-zinc-850">
                                                    {item.a}
                                                </p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {/* ==================== PAGE: CONTACT / ONBOARDING ==================== */}
                        {currentPage === 'contact' && (
                            <section className="py-16 px-6 max-w-2xl mx-auto space-y-8">
                                <div className="text-center space-y-3">
                                    <span className="text-amber-500 text-xs font-mono-tech font-bold uppercase tracking-widest">VERIFIED RERA ONBOARDING</span>
                                    <h1 className="font-heading text-4xl font-extrabold text-white">Apply for Network Access</h1>
                                    <p className="text-xs text-zinc-400 font-mono-tech">
                                        Exclusively for registered commercial real estate brokers in Jaipur.
                                    </p>
                                </div>

                                <form onSubmit={handleContactSubmit} className="p-8 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-5">
                                    <div className="space-y-1">
                                        <label className="text-xs text-zinc-400 font-mono-tech">Full Name / Agency Name</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={contactForm.name}
                                            onChange={e => setContactForm({...contactForm, name: e.target.value})}
                                            placeholder="e.g. Rajesh Sharma (Apex Estates)" 
                                            className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 text-xs font-mono-tech"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-xs text-zinc-400 font-mono-tech">WhatsApp Contact</label>
                                            <input 
                                                type="tel" 
                                                required
                                                value={contactForm.phone}
                                                onChange={e => setContactForm({...contactForm, phone: e.target.value})}
                                                placeholder="+91 98290 XXXXX" 
                                                className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 text-xs font-mono-tech"
                                            />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-xs text-zinc-400 font-mono-tech">RERA Registration No.</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={contactForm.rera}
                                                onChange={e => setContactForm({...contactForm, rera: e.target.value})}
                                                placeholder="RAJ/P/202X/XXX" 
                                                className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 text-xs font-mono-tech"
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-xs text-zinc-400 font-mono-tech">Primary Asset Focus / Micro-Market</label>
                                        <textarea 
                                            rows="3"
                                            value={contactForm.message}
                                            onChange={e => setContactForm({...contactForm, message: e.target.value})}
                                            placeholder="e.g. Retail Showrooms on Tonk Road, Warehousing along Ajmer Road SEZ" 
                                            className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 text-xs font-mono-tech"
                                        ></textarea>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 font-heading font-bold text-xs tracking-wide transition-all shadow-md"
                                    >
                                        Submit RERA Application
                                    </button>
                                </form>
                            </section>
                        )}

                        {/* ==================== PAGE: PRIVACY POLICY ==================== */}
                        {currentPage === 'privacy' && (
                            <section className="py-16 px-6 max-w-4xl mx-auto space-y-8 text-xs text-zinc-400 leading-relaxed font-sans">
                                <h1 className="font-heading text-3xl font-extrabold text-white">Privacy Policy</h1>
                                <p>Last updated: October 2026</p>

                                <div className="space-y-4">
                                    <h3 className="font-heading text-base font-bold text-white">1. Data Collection & Verification</h3>
                                    <p>Dravonis collects agent names, RERA registration numbers, phone numbers, and property mandate specifications solely for the purpose of validating broker authenticity and matching co-broking requirements inside our closed network.</p>

                                    <h3 className="font-heading text-base font-bold text-white">2. Off-Market Confidentiality</h3>
                                    <p>Exact pin locations and property owner contact details are never publicly broadcast. All match cards utilize anonymized micro-market indicators to protect listing exclusivity.</p>

                                    <h3 className="font-heading text-base font-bold text-white">3. Information Sharing</h3>
                                    <p>Agent contact information is disclosed only to another verified RERA broker upon a mutual match event confirmed by both parties within the exchange software.</p>
                                </div>
                            </section>
                        )}

                        {/* ==================== PAGE: TERMS OF SERVICE ==================== */}
                        {currentPage === 'terms' && (
                            <section className="py-16 px-6 max-w-4xl mx-auto space-y-8 text-xs text-zinc-400 leading-relaxed font-sans">
                                <h1 className="font-heading text-3xl font-extrabold text-white">Terms & Conditions</h1>
                                <p>Last updated: October 2026</p>

                                <div className="space-y-4">
                                    <h3 className="font-heading text-base font-bold text-white">1. Eligibility</h3>
                                    <p>Access to Dravonis is strictly limited to active, RERA-registered real estate agents and direct corporate mandate holders operating in India.</p>

                                    <h3 className="font-heading text-base font-bold text-white">2. Co-Broking Standards</h3>
                                    <p>Members agree to adhere to transparent brokerage split terms agreed upon during the matchmaking unlock phase. Dravonis does not collect direct commission splits from transactions unless explicitly governed by a separate escrow protocol.</p>

                                    <h3 className="font-heading text-base font-bold text-white">3. Termination</h3>
                                    <p>Accounts broadcasting fake listings, spam, or non-commercial residential listings will be permanently blacklisted from the network without prior notice.</p>
                                </div>
                            </section>
                        )}

                        {/* ==================== PAGE: 404 ERROR ==================== */}
                        {currentPage === '404' && (
                            <section className="py-32 px-6 text-center space-y-6">
                                <div className="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 text-amber-500 flex items-center justify-center mx-auto text-2xl font-mono-tech">
                                    404
                                </div>
                                <h1 className="font-heading text-3xl font-extrabold text-white">Listing Mandate Not Found</h1>
                                <p className="text-xs text-zinc-400 font-mono-tech max-w-md mx-auto">
                                    The property requirement card or sub-page you are attempting to view has been moved or unlisted from the Jaipur floor.
                                </p>
                                <button 
                                    onClick={() => navigateTo('home')}
                                    className="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-zinc-950 font-heading font-bold text-xs transition-all"
                                >
                                    Return to Main Floor
                                </button>
                            </section>
                        )}

                    </main>

                    {/* GLOBAL FOOTER */}
                    <footer className="py-10 px-6 border-t border-zinc-850 text-xs font-mono-tech text-zinc-500 bg-zinc-950">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                            
                            <div className="space-y-1 text-center md:text-left">
                                <div className="flex items-center justify-center md:justify-start space-x-2">
                                    <span className="font-bold text-white font-heading text-base tracking-tight">DRAVONIS</span>
                                    <span className="text-amber-500">•</span>
                                    <span>Commercial Real Estate Exchange</span>
                                </div>
                                <p className="text-[11px] text-zinc-600">Built for verified Indian RERA brokers. Operating in Jaipur.</p>
                            </div>

                            <div className="flex flex-wrap items-center justify-center gap-6 text-[11px]">
                                <button onClick={() => navigateTo('home')} className="hover:text-white transition-colors">Home</button>
                                <button onClick={() => navigateTo('engine')} className="hover:text-white transition-colors">Match Engine</button>
                                <button onClick={() => navigateTo('about')} className="hover:text-white transition-colors">About Us</button>
                                <button onClick={() => navigateTo('faq')} className="hover:text-white transition-colors">FAQs</button>
                                <button onClick={() => navigateTo('contact')} className="hover:text-white transition-colors">RERA Verification</button>
                                <button onClick={() => navigateTo('privacy')} className="hover:text-white transition-colors">Privacy Policy</button>
                                <button onClick={() => navigateTo('terms')} className="hover:text-white transition-colors">Terms of Service</button>
                                <button onClick={() => navigateTo('404')} className="hover:text-zinc-400 transition-colors text-zinc-700">Test 404</button>
                            </div>

                        </div>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
